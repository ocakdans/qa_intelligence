name = "qa-intelligence-slack-handler"
main = "worker.js"
compatibility_date = "2024-01-01"

# Per-run approval state lives in this KV namespace.
# Create it once with:
#   wrangler kv namespace create QA_STATE
# Then paste the printed `id` (and optional `preview_id`) below.
[[kv_namespaces]]
binding = "QA_STATE"
id = "f300ffb94a024a89b0368ebe2cab9788"

# Secrets to configure (run these commands once):
# wrangler secret put SLACK_SIGNING_SECRET
# wrangler secret put SLACK_BOT_TOKEN
# wrangler secret put GITHUB_TOKEN
# wrangler secret put GITHUB_REPO
