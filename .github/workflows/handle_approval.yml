name: Handle Slack Approval

on:
  repository_dispatch:
    types:
      - slack_approve
      - slack_reject
      - slack_add_test_case
      - slack_create_test_run
      - slack_skip_test_run

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── APPROVE ──────────────────────────────────────────────────────────────
      - name: Download test cases artifact
        if: github.event.action == 'slack_approve' || github.event.action == 'slack_add_test_case' || github.event.action == 'slack_create_test_run'
        uses: actions/download-artifact@v4
        with:
          name: test-cases-${{ github.event.client_payload.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.client_payload.run_id }}

      - name: Push test cases to Zephyr
        if: github.event.action == 'slack_approve'
        run: |
          python3 scripts/push_to_zephyr.py \
            --test-cases test_cases.json \
            --jira-task "${{ github.event.client_payload.jira_task_id }}"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}

      - name: Notify Slack — approved & pushed
        if: github.event.action == 'slack_approve'
        run: |
          python3 scripts/post_to_slack.py \
            --mode ask-test-run \
            --jira-task "${{ github.event.client_payload.jira_task_id }}" \
            --run-id "${{ github.event.client_payload.run_id }}" \
            --message-ts "${{ github.event.client_payload.message_ts }}" \
            --repo "${{ github.repository }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      # ── REJECT ───────────────────────────────────────────────────────────────
      - name: Notify Slack — rejected
        if: github.event.action == 'slack_reject'
        run: |
          python3 scripts/post_to_slack.py \
            --mode rejected \
            --jira-task "${{ github.event.client_payload.jira_task_id }}" \
            --message-ts "${{ github.event.client_payload.message_ts }}" \
            --repo "${{ github.repository }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      # ── ADD TEST CASE ─────────────────────────────────────────────────────────
      - name: Append manual test case and re-post
        if: github.event.action == 'slack_add_test_case'
        run: |
          python3 scripts/add_test_case.py \
            --test-cases test_cases.json \
            --title "${{ github.event.client_payload.title }}" \
            --steps "${{ github.event.client_payload.steps }}" \
            --expected "${{ github.event.client_payload.expected }}" \
            --output test_cases.json
          python3 scripts/post_to_slack.py \
            --test-cases test_cases.json \
            --jira-task "${{ github.event.client_payload.jira_task_id }}" \
            --run-id "${{ github.event.client_payload.run_id }}" \
            --message-ts "${{ github.event.client_payload.message_ts }}" \
            --repo "${{ github.repository }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Re-upload updated artifact
        if: github.event.action == 'slack_add_test_case'
        uses: actions/upload-artifact@v4
        with:
          name: test-cases-${{ github.event.client_payload.run_id }}
          path: test_cases.json
          overwrite: true
          retention-days: 7

      # ── CREATE TEST RUN ───────────────────────────────────────────────────────
      - name: Create test run in Zephyr
        if: github.event.action == 'slack_create_test_run'
        run: |
          python3 scripts/push_to_zephyr.py \
            --mode create-test-run \
            --jira-task "${{ github.event.client_payload.jira_task_id }}" \
            --test-cases test_cases.json
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}

      - name: Notify Slack — test run created
        if: github.event.action == 'slack_create_test_run'
        run: |
          python3 scripts/post_to_slack.py \
            --mode test-run-created \
            --jira-task "${{ github.event.client_payload.jira_task_id }}" \
            --message-ts "${{ github.event.client_payload.message_ts }}" \
            --repo "${{ github.repository }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Notify Slack — test run skipped
        if: github.event.action == 'slack_skip_test_run'
        run: |
          python3 scripts/post_to_slack.py \
            --mode test-run-skipped \
            --jira-task "${{ github.event.client_payload.jira_task_id }}" \
            --message-ts "${{ github.event.client_payload.message_ts }}" \
            --repo "${{ github.repository }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
